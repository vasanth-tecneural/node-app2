# Generated by DeepAgent for project "node-dev" (env "dev"). Regenerated on every deploy — edits here are overwritten; delete this line to keep the file as your own.
name: CD (deploy all services) · node-dev

# Runs after the CI workflow ("CI (build all services) · node-dev") completes successfully.
# Also supports manual dispatch for redeploying without a fresh build.
# Releases are AUTOMATIC for this environment: a successful CI build deploys.
on:
  workflow_run:
    workflows: ["CI (build all services) · node-dev"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  app-env-app:
    name: App env (app ← GitHub environment dev)
    runs-on: ubuntu-latest
    environment: "dev"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      changed: ${{ steps.write.outputs.changed }}
    steps:
      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-vasanth-tecneural-node-app2-node-app2
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "node-dev-dev" --region us-east-1

      - name: Write GitHub environment values to Secret app-env-app
        id: write
        # Values reach the step only through env: — GitHub masks secrets in
        # logs and expands them nowhere else. The DDA_V_ prefix keeps an app
        # setting called PATH or HOME from breaking the shell below.
        env:
          DDA_V_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DDA_V_NODE_ENV: ${{ vars.NODE_ENV }}
          DDA_V_PORT: ${{ vars.PORT }}
        run: |
          set -euo pipefail
          kubectl get namespace "node-dev" >/dev/null 2>&1 || kubectl create namespace "node-dev"
          # Fingerprint the Secret before and after. The deploy job restarts
          # this service when an EXISTING Secret changed; one this job creates
          # belongs to a first deploy, whose pods read it as they start.
          fp() { local d; d=$(kubectl -n node-dev get secret app-env-app -o jsonpath='{.data}' 2>/dev/null) || return 0; printf '%s' "$d" | sha256sum | cut -c1-16; }
          BEFORE=$(fp)
          ARGS=()
          for NAME in SECRET_KEY NODE_ENV PORT; do
            SRC="DDA_V_$NAME"
            VAL="${!SRC:-}"
            # A value pasted with a Windows line ending reaches the pod as
            # "x\r\n", and the app rejects its own valid setting.
            VAL="${VAL//$'\r'/}"; VAL="${VAL%%$'\n'}"
            if [ -n "$VAL" ]; then
              ARGS+=("--from-literal=$NAME=$VAL")
            else
              echo "::warning::$NAME is not set in GitHub environment 'dev' — the app pod will not see it."
            fi
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            DOC=$(kubectl -n node-dev create secret generic app-env-app "${ARGS[@]}" --dry-run=client -o json)
            if kubectl -n node-dev get secret app-env-app >/dev/null 2>&1; then
              kubectl -n node-dev patch secret app-env-app --type merge -p "$DOC"
            else
              printf '%s' "$DOC" | kubectl -n node-dev create -f -
            fi
          fi
          if [ -n "$BEFORE" ] && [ "$(fp)" != "$BEFORE" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  app-env-frontend:
    name: App env (frontend ← GitHub environment dev)
    runs-on: ubuntu-latest
    environment: "dev"
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      changed: ${{ steps.write.outputs.changed }}
    steps:
      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-vasanth-tecneural-node-app2-node-app2
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "node-dev-dev" --region us-east-1

      - name: Write GitHub environment values to Secret app-env-frontend
        id: write
        # Values reach the step only through env: — GitHub masks secrets in
        # logs and expands them nowhere else. The DDA_V_ prefix keeps an app
        # setting called PATH or HOME from breaking the shell below.
        env:
          DDA_V_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DDA_V_NODE_ENV: ${{ vars.NODE_ENV }}
          DDA_V_PORT: ${{ vars.PORT }}
        run: |
          set -euo pipefail
          kubectl get namespace "node-dev" >/dev/null 2>&1 || kubectl create namespace "node-dev"
          # Fingerprint the Secret before and after. The deploy job restarts
          # this service when an EXISTING Secret changed; one this job creates
          # belongs to a first deploy, whose pods read it as they start.
          fp() { local d; d=$(kubectl -n node-dev get secret app-env-frontend -o jsonpath='{.data}' 2>/dev/null) || return 0; printf '%s' "$d" | sha256sum | cut -c1-16; }
          BEFORE=$(fp)
          ARGS=()
          for NAME in SECRET_KEY NODE_ENV PORT; do
            SRC="DDA_V_$NAME"
            VAL="${!SRC:-}"
            # A value pasted with a Windows line ending reaches the pod as
            # "x\r\n", and the app rejects its own valid setting.
            VAL="${VAL//$'\r'/}"; VAL="${VAL%%$'\n'}"
            if [ -n "$VAL" ]; then
              ARGS+=("--from-literal=$NAME=$VAL")
            else
              echo "::warning::$NAME is not set in GitHub environment 'dev' — the frontend pod will not see it."
            fi
          done
          if [ ${#ARGS[@]} -gt 0 ]; then
            DOC=$(kubectl -n node-dev create secret generic app-env-frontend "${ARGS[@]}" --dry-run=client -o json)
            if kubectl -n node-dev get secret app-env-frontend >/dev/null 2>&1; then
              kubectl -n node-dev patch secret app-env-frontend --type merge -p "$DOC"
            else
              printf '%s' "$DOC" | kubectl -n node-dev create -f -
            fi
          fi
          if [ -n "$BEFORE" ] && [ "$(fp)" != "$BEFORE" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    name: Deploy all services
    runs-on: ubuntu-latest
    needs: [app-env-app, app-env-frontend]

    # dda:release-gate
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-vasanth-tecneural-node-app2-node-app2
          aws-region: us-east-1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access (keyless)
        run: aws eks update-kubeconfig --name "node-dev-dev" --region us-east-1

      - name: Ensure namespace node-dev is Active (auto-heal if stuck Terminating)
        # Three-stage self-heal — see cicd-pipeline.ts for the full rationale.
        # Stage 1: wait 60s for natural termination.
        # Stage 2: force-clear finalizers on Services + PVCs, wait 30s.
        # Stage 3: nuke the namespace's own finalizer via /finalize subresource.
        run: |
          set -eu
          NS="node-dev"
          ns_phase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || echo ""; }
          for i in $(seq 1 30); do
            p=$(ns_phase)
            { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
            echo "namespace $NS is $p — waiting for natural termination ($i/30)"
            sleep 2
          done
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating after 60s — auto-clearing finalizers on Services and PVCs."
            for kind in svc pvc; do
              for res in $(kubectl get "$kind" -n "$NS" -o name 2>/dev/null); do
                echo "  clearing finalizers on $res"
                kubectl patch "$res" -n "$NS" -p '{"metadata":{"finalizers":null}}' --type=merge >/dev/null 2>&1 || true
              done
            done
            for i in $(seq 1 15); do
              p=$(ns_phase)
              { [ -z "$p" ] || [ "$p" = "Active" ]; } && break
              sleep 2
            done
          fi
          p=$(ns_phase)
          if [ "$p" = "Terminating" ]; then
            echo "::warning::Namespace $NS still Terminating — force-clearing its own finalizer via /finalize subresource."
            if command -v jq >/dev/null 2>&1; then
              kubectl get namespace "$NS" -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            else
              printf '%s' '{"apiVersion":"v1","kind":"Namespace","metadata":{"name":"'"$NS"'"},"spec":{"finalizers":[]}}' | kubectl replace --raw "/api/v1/namespaces/$NS/finalize" -f - >/dev/null 2>&1 || true
            fi
            sleep 3
          fi
          p=$(ns_phase)
          [ -z "$p" ] && kubectl create namespace "$NS"
          p=$(ns_phase)
          if [ "$p" != "Active" ]; then
            echo "::error::Namespace $NS auto-heal exhausted; still $p. Ask the agent to run unstick_terminating_namespace for deep diagnosis."
            exit 1
          fi
          echo "namespace $NS is Active — proceeding with apply."

      - name: Pin app manifests to the built commit
        id: pin_app
        # The committed manifests carry `<repo>:latest`. Deploying a MOVING tag
        # makes every rollout revision hold the SAME image string, so
        # `kubectl rollout undo` brings the identical image back and a rollback
        # silently does nothing — the Versions page then lists history that
        # cannot actually be returned to. Rewriting `:latest` to the commit SHA
        # CI just built gives every deploy its own immutable revision, which is
        # what makes version history and one-click rollback real.
        #
        # workflow_run ONLY: CI pushed `<repo>:<head_sha>` moments ago, so that
        # tag is guaranteed to exist. A manual dispatch can sit on a commit CI
        # never built, so it keeps `:latest` rather than rolling the app onto a
        # tag that would ImagePullBackOff.
        #
        # The rewrite is runner-local — the manifests in git stay on `:latest`
        # so they remain valid for a hand-run `kubectl apply`.
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -eu
          SHA="${{ github.event.workflow_run.head_sha }}"
          for f in "k8s/node-dev/dev/app"/*.yaml "k8s/node-dev/dev/app"/*.yml; do
            [ -f "$f" ] || continue
            sed -i "s|\(image: .*\):latest|\1:$SHA|" "$f"
          done
          echo "pinned app images to $SHA:"
          grep -h "image:" "k8s/node-dev/dev/app"/*.yaml "k8s/node-dev/dev/app"/*.yml 2>/dev/null || true

      - name: Apply app manifests
        id: apply_app
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/node-dev/dev/app/manifest.yaml" ]; then
            kubectl apply -n node-dev -f "k8s/node-dev/dev/app/manifest.yaml"
          else
            # YAML ONLY. This same directory also holds facts.json (the
            # Deployment Facts written beside the manifest for caching and for
            # the diagnose step). A directory apply feeds EVERY file in it to
            # the validator, so that JSON fails with "apiVersion not set, kind
            # not set" and takes the whole apply down with it — after the real
            # manifests had already been created, which is what made it look
            # like a rollout problem (2026-09, deepjavatest frontend).
            set --
            for f in "k8s/node-dev/dev/app"/*.yaml "k8s/node-dev/dev/app"/*.yml; do
              [ -f "$f" ] && set -- "$@" -f "$f"
            done
            if [ "$#" -eq 0 ]; then
              echo "No YAML manifests found in k8s/node-dev/dev/app/" >&2
              exit 1
            fi
            kubectl apply -n node-dev "$@"
          fi

      - name: Restart app rollout (manual dispatch, or its configuration changed)
        id: restart_app
        # On workflow_run the pinned apply above already changed the image, which
        # starts the rollout by itself; restarting as well would add a second,
        # identical revision to the history for every deploy. Only a manual
        # dispatch re-applies the same `:latest` tag and needs a forced restart
        # to pull whatever that tag now points at.
        if: ${{ github.event_name != 'workflow_run' || needs['app-env-app'].outputs.changed == 'true' }}
        run: kubectl rollout restart deployment/node-app2-app -n node-dev

      - name: Wait for app rollout
        id: wait_app
        run: kubectl rollout status deployment/node-app2-app -n node-dev --timeout=360s

      - name: Diagnose app on failed rollout
        # Runs BEFORE rollback so the job log preserves what actually went wrong
        # — the rollback undoes the state that would answer "why did it fail?".
        # Prints pods + describe + logs + events, and detects the port-mismatch
        # class (contract §5) by reading /proc/net/tcp{,6} inside the container.
        if: ${{ always() && (steps.pin_app.outcome == 'failure' || steps.apply_app.outcome == 'failure' || steps.restart_app.outcome == 'failure' || steps.wait_app.outcome == 'failure') }}
        continue-on-error: true
        run: |
          echo "::group::pods"
          kubectl get pods -n node-dev -l app.kubernetes.io/name=node-app2-app -o wide || true
          echo "::endgroup::"
          echo "::group::describe"
          kubectl describe pods -n node-dev -l app.kubernetes.io/name=node-app2-app | tail -n 60 || true
          echo "::endgroup::"
          echo "::group::logs"
          kubectl logs -n node-dev -l app.kubernetes.io/name=node-app2-app --tail=100 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events -n node-dev --sort-by=.lastTimestamp | tail -n 30 || true
          echo "::endgroup::"
          echo "::group::deployment facts (from facts.json, committed at discovery time)"
          FACTS_FILE=$(ls -1 k8s/*/app/facts.json k8s/*/facts.json 2>/dev/null | head -n 1 || true)
          if [ -n "$FACTS_FILE" ] && [ -f "$FACTS_FILE" ]; then
            echo "reading $FACTS_FILE"
            if command -v jq >/dev/null 2>&1; then jq . "$FACTS_FILE" || cat "$FACTS_FILE"; else cat "$FACTS_FILE"; fi
          else
            echo "no facts.json found (this pipeline predates the discovery layer, or discovery failed for this service)"
          fi
          echo "::endgroup::"
          echo "::group::port-mismatch check"
          POD=$(kubectl get pods -n node-dev -l app.kubernetes.io/name=node-app2-app -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            PROBE_PORT=$(kubectl get pod -n node-dev "$POD" -o jsonpath='{.spec.containers[0].ports[0].containerPort}' 2>/dev/null || echo "")
            LISTENING=$(kubectl exec -n node-dev "$POD" -- sh -c '
              for f in /proc/net/tcp /proc/net/tcp6; do
                [ -r "$f" ] || continue
                awk "NR>1 && \$4==\"0A\" { split(\$2,a,\":\"); print strtonum(\"0x\" a[2]) }" "$f"
              done | sort -u
            ' 2>/dev/null | tr "\n" " " || true)
            echo "probe expects port: $PROBE_PORT"
            echo "app is listening on: ${LISTENING:-(nothing — process may have exited)}"
            if [ -n "$PROBE_PORT" ] && [ -n "$LISTENING" ] && ! echo " $LISTENING " | grep -q " $PROBE_PORT "; then
              echo "::error::PORT MISMATCH — probes dial :$PROBE_PORT but the app is only listening on: $LISTENING. Set PORT env in the manifest to match the app, or update containerPort/probe ports."
            fi
          else
            echo "no pod found for label app.kubernetes.io/name=node-app2-app"
          fi
          echo "::endgroup::"

      - name: Rollback app on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        # Contract §5: skip `rollout undo` on the first-ever deploy (history
        # has only one revision — there's nothing to undo to; erroring on that
        # confuses the log). We still print a clear message so the reader knows
        # the pipeline recognised a first-deploy vs. an actual failure.
        # `grep -c` prints 0 AND exits 1 when nothing matches, so an
        # `|| echo 0` after it printed a SECOND 0; the two-line value failed
        # the integer test and the step fell through to an undo with nothing
        # to undo — "no rollout history found" (2026-09-11). And only lines that
        # START with a revision number count: kubectl ends the history with a
        # blank line, which `grep -c '^'` read as a second revision — one
        # revision taken for two, and the same undo with nothing to undo.
        if: ${{ always() && (steps.pin_app.outcome == 'failure' || steps.apply_app.outcome == 'failure' || steps.restart_app.outcome == 'failure' || steps.wait_app.outcome == 'failure') }}
        run: |
          REVS=$(kubectl rollout history deployment/node-app2-app -n node-dev 2>/dev/null | tail -n +3 | grep -c '^[0-9]' || true)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of node-app2-app failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of node-app2-app failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/node-app2-app -n node-dev
          kubectl rollout status deployment/node-app2-app -n node-dev --timeout=240s

      - name: Pin frontend manifests to the built commit
        id: pin_frontend
        # The committed manifests carry `<repo>:latest`. Deploying a MOVING tag
        # makes every rollout revision hold the SAME image string, so
        # `kubectl rollout undo` brings the identical image back and a rollback
        # silently does nothing — the Versions page then lists history that
        # cannot actually be returned to. Rewriting `:latest` to the commit SHA
        # CI just built gives every deploy its own immutable revision, which is
        # what makes version history and one-click rollback real.
        #
        # workflow_run ONLY: CI pushed `<repo>:<head_sha>` moments ago, so that
        # tag is guaranteed to exist. A manual dispatch can sit on a commit CI
        # never built, so it keeps `:latest` rather than rolling the app onto a
        # tag that would ImagePullBackOff.
        #
        # The rewrite is runner-local — the manifests in git stay on `:latest`
        # so they remain valid for a hand-run `kubectl apply`.
        if: ${{ github.event_name == 'workflow_run' }}
        run: |
          set -eu
          SHA="${{ github.event.workflow_run.head_sha }}"
          for f in "k8s/node-dev/dev/frontend"/*.yaml "k8s/node-dev/dev/frontend"/*.yml; do
            [ -f "$f" ] || continue
            sed -i "s|\(image: .*\):latest|\1:$SHA|" "$f"
          done
          echo "pinned frontend images to $SHA:"
          grep -h "image:" "k8s/node-dev/dev/frontend"/*.yaml "k8s/node-dev/dev/frontend"/*.yml 2>/dev/null || true

      - name: Apply frontend manifests
        id: apply_frontend
        # Prefer manifest.yaml — deploy_my_app writes exactly that file, and
        # applying the whole dir picks up any stale *.yaml (e.g. a
        # hand-committed service.yaml from an older scaffold) that
        # alphabetically-sorts AFTER it and silently overrides the freshly
        # generated resource (2026-08 incident). Fall back to the dir for
        # repos whose manifests are still split across multiple files.
        run: |
          if [ -f "k8s/node-dev/dev/frontend/manifest.yaml" ]; then
            kubectl apply -n node-dev -f "k8s/node-dev/dev/frontend/manifest.yaml"
          else
            # YAML ONLY. This same directory also holds facts.json (the
            # Deployment Facts written beside the manifest for caching and for
            # the diagnose step). A directory apply feeds EVERY file in it to
            # the validator, so that JSON fails with "apiVersion not set, kind
            # not set" and takes the whole apply down with it — after the real
            # manifests had already been created, which is what made it look
            # like a rollout problem (2026-09, deepjavatest frontend).
            set --
            for f in "k8s/node-dev/dev/frontend"/*.yaml "k8s/node-dev/dev/frontend"/*.yml; do
              [ -f "$f" ] && set -- "$@" -f "$f"
            done
            if [ "$#" -eq 0 ]; then
              echo "No YAML manifests found in k8s/node-dev/dev/frontend/" >&2
              exit 1
            fi
            kubectl apply -n node-dev "$@"
          fi

      - name: Restart frontend rollout (manual dispatch, or its configuration changed)
        id: restart_frontend
        # On workflow_run the pinned apply above already changed the image, which
        # starts the rollout by itself; restarting as well would add a second,
        # identical revision to the history for every deploy. Only a manual
        # dispatch re-applies the same `:latest` tag and needs a forced restart
        # to pull whatever that tag now points at.
        if: ${{ github.event_name != 'workflow_run' || needs['app-env-frontend'].outputs.changed == 'true' }}
        run: kubectl rollout restart deployment/node-app2-frontend -n node-dev

      - name: Wait for frontend rollout
        id: wait_frontend
        run: kubectl rollout status deployment/node-app2-frontend -n node-dev --timeout=360s

      - name: Diagnose frontend on failed rollout
        # Runs BEFORE rollback so the job log preserves what actually went wrong
        # — the rollback undoes the state that would answer "why did it fail?".
        # Prints pods + describe + logs + events, and detects the port-mismatch
        # class (contract §5) by reading /proc/net/tcp{,6} inside the container.
        if: ${{ always() && (steps.pin_frontend.outcome == 'failure' || steps.apply_frontend.outcome == 'failure' || steps.restart_frontend.outcome == 'failure' || steps.wait_frontend.outcome == 'failure') }}
        continue-on-error: true
        run: |
          echo "::group::pods"
          kubectl get pods -n node-dev -l app.kubernetes.io/name=node-app2-frontend -o wide || true
          echo "::endgroup::"
          echo "::group::describe"
          kubectl describe pods -n node-dev -l app.kubernetes.io/name=node-app2-frontend | tail -n 60 || true
          echo "::endgroup::"
          echo "::group::logs"
          kubectl logs -n node-dev -l app.kubernetes.io/name=node-app2-frontend --tail=100 --all-containers=true --prefix=true || true
          echo "::endgroup::"
          echo "::group::events"
          kubectl get events -n node-dev --sort-by=.lastTimestamp | tail -n 30 || true
          echo "::endgroup::"
          echo "::group::deployment facts (from facts.json, committed at discovery time)"
          FACTS_FILE=$(ls -1 k8s/*/frontend/facts.json k8s/*/facts.json 2>/dev/null | head -n 1 || true)
          if [ -n "$FACTS_FILE" ] && [ -f "$FACTS_FILE" ]; then
            echo "reading $FACTS_FILE"
            if command -v jq >/dev/null 2>&1; then jq . "$FACTS_FILE" || cat "$FACTS_FILE"; else cat "$FACTS_FILE"; fi
          else
            echo "no facts.json found (this pipeline predates the discovery layer, or discovery failed for this service)"
          fi
          echo "::endgroup::"
          echo "::group::port-mismatch check"
          POD=$(kubectl get pods -n node-dev -l app.kubernetes.io/name=node-app2-frontend -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$POD" ]; then
            PROBE_PORT=$(kubectl get pod -n node-dev "$POD" -o jsonpath='{.spec.containers[0].ports[0].containerPort}' 2>/dev/null || echo "")
            LISTENING=$(kubectl exec -n node-dev "$POD" -- sh -c '
              for f in /proc/net/tcp /proc/net/tcp6; do
                [ -r "$f" ] || continue
                awk "NR>1 && \$4==\"0A\" { split(\$2,a,\":\"); print strtonum(\"0x\" a[2]) }" "$f"
              done | sort -u
            ' 2>/dev/null | tr "\n" " " || true)
            echo "probe expects port: $PROBE_PORT"
            echo "app is listening on: ${LISTENING:-(nothing — process may have exited)}"
            if [ -n "$PROBE_PORT" ] && [ -n "$LISTENING" ] && ! echo " $LISTENING " | grep -q " $PROBE_PORT "; then
              echo "::error::PORT MISMATCH — probes dial :$PROBE_PORT but the app is only listening on: $LISTENING. Set PORT env in the manifest to match the app, or update containerPort/probe ports."
            fi
          else
            echo "no pod found for label app.kubernetes.io/name=node-app2-frontend"
          fi
          echo "::endgroup::"

      - name: Rollback frontend on failed rollout
        # Scoped to THIS service's own step outcomes (see sequentialDeploySteps
        # comment). `always()` lets the step evaluate even when the job status
        # is failure; the inner condition prevents rollback firing for a
        # service whose steps were skipped because an earlier service failed.
        # Contract §5: skip `rollout undo` on the first-ever deploy (history
        # has only one revision — there's nothing to undo to; erroring on that
        # confuses the log). We still print a clear message so the reader knows
        # the pipeline recognised a first-deploy vs. an actual failure.
        # `grep -c` prints 0 AND exits 1 when nothing matches, so an
        # `|| echo 0` after it printed a SECOND 0; the two-line value failed
        # the integer test and the step fell through to an undo with nothing
        # to undo — "no rollout history found" (2026-09-11). And only lines that
        # START with a revision number count: kubectl ends the history with a
        # blank line, which `grep -c '^'` read as a second revision — one
        # revision taken for two, and the same undo with nothing to undo.
        if: ${{ always() && (steps.pin_frontend.outcome == 'failure' || steps.apply_frontend.outcome == 'failure' || steps.restart_frontend.outcome == 'failure' || steps.wait_frontend.outcome == 'failure') }}
        run: |
          REVS=$(kubectl rollout history deployment/node-app2-frontend -n node-dev 2>/dev/null | tail -n +3 | grep -c '^[0-9]' || true)
          if [ "$REVS" -lt 2 ]; then
            echo "::warning::Rollout of node-app2-frontend failed and this is the first-ever deploy (rollout history has $REVS revision). Nothing to roll back to — leaving the failed pods in place so you can debug them."
            exit 1
          fi
          echo "::warning::Rollout of node-app2-frontend failed its health check — rolling back to the previous revision."
          kubectl rollout undo deployment/node-app2-frontend -n node-dev
          kubectl rollout status deployment/node-app2-frontend -n node-dev --timeout=240s
